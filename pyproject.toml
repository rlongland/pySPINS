[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyspins"
version = "0.1.0"
description = "Interactive Stern-Gerlach quantum spin simulation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Richard Longland", email = "rlongland@gmail.com" }]
keywords = ["physics", "quantum-mechanics", "simulation", "education", "stern-gerlach"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "pyside6>=6.7",
    "numpy>=1.26",
]

[project.scripts]
pyspins = "pyspins.app:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4"]

[tool.hatch.build.targets.wheel]
packages = ["src/pyspins"]

[tool.hatch.build.targets.sdist]
exclude = [
    "venv/",
    ".venv/",
    "*.log",
    "ralph-logs/",
    "demos/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
